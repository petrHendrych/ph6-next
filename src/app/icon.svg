<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
	<!-- PH6 — the studio numeral reversed out of a solid plate, in the same
	     Raleway as the wordmark. The plate is what makes the mark hold at 16px
	     and keeps it visible whatever colour the tab strip is; the two roles swap
	     under prefers-color-scheme so it reads on light and dark alike. -->
	<style>
		.plate { fill: #171717; }
		.mark { fill: #ffffff; }
		@media (prefers-color-scheme: dark) {
			.plate { fill: #ffffff; }
			.mark { fill: #171717; }
		}
	</style>
